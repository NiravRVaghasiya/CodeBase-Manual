<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Codebase Manual</title>
  <style>
    body { font-family: -apple-system, Segoe UI, Helvetica, Arial, sans-serif; max-width: 900px; margin: 2rem auto; padding: 0 1rem; color: #1a1a1a; }
    nav a { margin-right: 1rem; text-decoration: none; color: #0b5fff; }
    h1, h2, h3 { line-height: 1.3; }
    code, pre { background: #f4f4f4; padding: 0.15rem 0.35rem; border-radius: 3px; font-size: 0.9em; }
    table { border-collapse: collapse; width: 100%; margin: 1rem 0; }
    th, td { text-align: left; border-bottom: 1px solid #ddd; padding: 0.4rem 0.5rem; }
    .confidence-high { color: #0a7a2c; }
    .confidence-medium { color: #a06400; }
    .confidence-low { color: #a01a1a; }
    .error { color: #a01a1a; border: 1px solid #a01a1a; padding: 0.75rem; border-radius: 4px; }
    .evidence { color: #555; font-size: 0.9em; }
    textarea, input[type=text] { width: 100%; padding: 0.5rem; font-size: 1rem; box-sizing: border-box; }
    button { margin-top: 0.5rem; padding: 0.5rem 1rem; font-size: 1rem; cursor: pointer; }
    section { margin-bottom: 1.5rem; }
  </style>
</head>
<body>
  <nav>
    <a href="/">Overview</a>
    <a href="/files">Files</a>
    <a href="/ask">Ask</a>
    <a href="/change">Change</a>
    <a href="/impact">Impact</a>
  </nav>
  <hr />
  {% block content %}{% endblock %}
</body>
</html>
